<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Form Photo & Signature KB Resizer</title>
    <meta name="description" content="Free online tool to compress and resize photo and signature in KB for SSC, UPSC, Banking and all Indian Government competitive exams with high quality.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #1a73e8; text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input[type="file"], select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: #fff; }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        .result-box { margin-top: 25px; padding: 15px; background: #e8f0fe; border-radius: 5px; display: none; text-align: center; }
        .result-box h3 { margin-bottom: 10px; color: #1a73e8; }
        canvas { display: none; }
        .preview-img { max-width: 180px; max-height: 180px; margin: 10px auto; display: block; border: 1px solid #ccc; background: #fff; padding: 2px; }
        .download-btn { display: inline-block; background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 10px; }
        .download-btn:hover { background-color: #218838; }
        .seo-text { margin-top: 30px; font-size: 12px; color: #555; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Govt Form Photo & Signature KB Resizer</h1>
    <p class="subtitle">High Quality Compression - SSC, Banking, UPSC & State Exams ke liye</p>

    <div class="form-group">
        <label for="imageInput">1. Apni Photo ya Signature Select Karein:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="row">
        <div class="form-group">
            <label for="presetSelect">2. Standard Requirement:</label>
            <select id="presetSelect" onchange="applyPreset()">
                <option value="custom">Custom Size</option>
                <option value="ssc_photo">SSC Photo (Max 50 KB)</option>
                <option value="ssc_sign">SSC Signature (Max 20 KB)</option>
                <option value="pan_photo">PAN Card / Aadhaar Photo (Max 50 KB)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="maxKb">3. Target Max Size (KB):</label>
            <input type="number" id="maxKb" value="50">
        </div>
    </div>

    <button onclick="startResize()">Compress & Maintain Quality</button>

    <div class="result-box" id="resultBox">
        <h3>Compression Successful!</h3>
        <img id="preview" class="preview-img" alt="High Quality Compressed Preview">
        <p id="fileInfo" style="font-size: 13px; margin-bottom: 10px;"></p>
        <a id="downloadBtn" class="download-btn" download="sarkari-resized-image.jpg">Download Clean Image</a>
    </div>

    <canvas id="canvas"></canvas>

    <div class="seo-text">
        <strong>Supported Exams:</strong> SSC (CGL, CHSL, GD), Railway RRB, IBPS Banking, UPSC, State Police & All Government Online Forms.
    </div>
</div>

<script>
    function applyPreset() {
        var val = document.getElementById('presetSelect').value;
        var kbInput = document.getElementById('maxKb');
        if(val === 'ssc_photo') kbInput.value = 48;
        if(val === 'ssc_sign') kbInput.value = 18;
        if(val === 'pan_photo') kbInput.value = 45;
    }

    function startResize() {
        var fileInput = document.getElementById('imageInput');
        var maxKb = parseInt(document.getElementById('maxKb').value) || 50;

        if (!fileInput.files || fileInput.files.length === 0) {
            alert('Pehle koi image select karein!');
            return;
        }

        var file = fileInput.files[0];
        var reader = new FileReader();

        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.getElementById('canvas');
                var ctx = canvas.getContext('2d');

                var width = img.width;
                var height = img.height;

                // Smart scaling: taaki quality kharab na ho aur size bhi limit me aaye
                var maxDimension = 900;
                if (maxKb <= 25) {
                    maxDimension = 500; // Signature ke liye chhota size lekin sharp
                }

                if (width > maxDimension || height > maxDimension) {
                    if (width > height) {
                        height = Math.round((height * maxDimension) / width);
                        width = maxDimension;
                    } else {
                        width = Math.round((width * maxDimension) / height);
                        height = maxDimension;
                    }
                }

                canvas.width = width;
                canvas.height = height;

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);

                // Start with high quality and slowly step down only if needed
                var quality = 0.95;
                var dataUrl = canvas.toDataURL('image/jpeg', quality);
                
                while ((dataUrl.length * (3/4)) > maxKb * 1024 && quality > 0.3) {
                    quality -= 0.03; // Smooth step down taaki ekdum se quality na phate
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                }

                var finalSizeKb = Math.round((dataUrl.length * (3/4)) / 1024);

                document.getElementById('preview').src = dataUrl;
                document.getElementById('fileInfo').innerHTML = 'Final Size: <b>' + finalSizeKb + ' KB</b> (Target: &lt; ' + maxKb + ' KB)';
                document.getElementById('downloadBtn').href = dataUrl;
                document.getElementById('resultBox').style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
